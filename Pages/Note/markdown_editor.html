<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="实时Markdown编辑器 - 支持实时预览的在线Markdown写作工具">

    <meta name="theme-color" content="#0D1117">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://negiao.github.io/Pages/markdown_editor.html">
    <meta property="og:title" content="Markdown 编辑器 - NEGIAO">
    <meta property="og:description" content="实时Markdown编辑器 - 支持实时预览的在线Markdown写作工具">

    <title>Markdown 编辑器 - NEGIAO</title>

    <link rel="stylesheet" href="https://cdnjs.loli.net/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* ================================
           Markdown Editor — Modern Glass UI
           ================================ */

        body {
            font-family: var(--font-sans);
            line-height: 1.7;
            color: var(--text);
            background: var(--background);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---- Page Layout ---- */
        .editor-page {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1500px;
            width: 100%;
            margin: 0 auto;
            padding: var(--space-lg) var(--space-xl) var(--space-xl);
            gap: var(--space-md);
            min-height: 0;
        }

        /* ---- Header ---- */
        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: var(--space-md);
        }

        .editor-header__left {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .editor-header__back {
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            transition: all var(--transition-slow);
            padding: var(--space-xs) var(--space-sm);
            border-radius: var(--radius-md);
        }

        .editor-header__back:hover {
            color: var(--primary);
            background: var(--surface);
            transform: translateX(-2px);
        }

        .editor-header__title {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin: 0;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
        }

        .editor-header__title-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-md);
            background: var(--gradient-primary);
            color: #fff;
            font-size: 0.85rem;
            box-shadow: 0 2px 10px color-mix(in srgb, var(--primary) 25%, transparent);
        }

        .editor-header__meta {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .editor-visit-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            transition: border-color var(--transition-slow);
        }

        .editor-visit-badge:hover {
            border-color: var(--border-light);
        }

        .editor-visit-badge i {
            font-size: 0.7rem;
            color: var(--primary);
        }

        /* ---- Header Widget Buttons ---- */
        .editor-header__widget-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition-slow);
            font-size: 0.8rem;
            position: relative;
        }

        .editor-header__widget-btn:hover {
            background: var(--surface-elevated);
            color: var(--text);
            border-color: var(--border-light);
            box-shadow: var(--shadow-sm);
            transform: translateY(-1px);
        }

        .editor-header__widget-btn:active {
            transform: scale(0.94);
        }

        .editor-header__widget-btn i {
            transition: transform var(--transition-slow);
        }

        .editor-header__widget-btn:hover i {
            transform: scale(1.1);
        }

        #editor-theme-btn:hover i {
            transform: rotate(150deg);
        }

        #editor-share-btn.copied {
            border-color: var(--success);
            color: var(--success);
            background: color-mix(in srgb, var(--success) 10%, transparent);
        }

        #editor-lang-btn {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        #editor-lang-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        /* ---- Toolbar ---- */
        .editor-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            flex-wrap: wrap;
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .toolbar-group {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 3px;
            background: var(--background-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            animation: toolbarFadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        .toolbar-group:nth-child(1) { animation-delay: 0ms; }
        .toolbar-group:nth-child(3) { animation-delay: 50ms; }
        .toolbar-group:nth-child(5) { animation-delay: 100ms; }
        .toolbar-group:nth-child(7) { animation-delay: 150ms; }
        .toolbar-group:nth-child(9) { animation-delay: 200ms; }

        @keyframes toolbarFadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 2px;
            flex-shrink: 0;
        }

        .toolbar-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 5px 10px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all var(--transition-normal);
            white-space: nowrap;
            min-width: 30px;
            min-height: 30px;
            position: relative;
        }

        .toolbar-btn:hover:not(:disabled) {
            background: var(--surface-elevated);
            color: var(--text);
            border-color: var(--border-light);
            box-shadow: var(--shadow-xs);
        }

        .toolbar-btn:active:not(:disabled) {
            background: var(--surface-hover);
            transform: scale(0.94);
        }

        .toolbar-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .toolbar-btn i {
            font-size: 0.8rem;
            width: 14px;
            text-align: center;
            transition: transform var(--transition-normal);
        }

        .toolbar-btn:hover:not(:disabled) i {
            transform: scale(1.1);
        }

        .toolbar-btn__label {
            font-size: 0.65rem;
            opacity: 0.7;
            font-weight: 700;
            line-height: 1;
        }

        .toolbar-btn--icon-only {
            padding: 5px;
            min-width: 30px;
        }

        .toolbar-btn--active {
            background: var(--surface-elevated);
            color: var(--primary);
            border-color: var(--border-light);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .toolbar-btn--active i {
            color: var(--primary);
        }

        /* Tooltip on hover */
        .toolbar-btn::after {
            content: attr(title);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            padding: 4px 10px;
            background: var(--surface-hover);
            color: var(--text);
            font-size: 0.7rem;
            font-weight: 500;
            border-radius: var(--radius-xs);
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all var(--transition-normal);
            z-index: 100;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
        }

        .toolbar-btn:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ---- Editor Split Pane ---- */
        .editor-split {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            overflow: hidden;
            background: var(--surface);
            min-height: 0;
            position: relative;
            box-shadow: var(--shadow-lg);
        }

        .editor-pane,
        .preview-pane {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .editor-pane {
            border-right: 1px solid var(--border);
        }

        .pane-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px var(--space-md);
            background: var(--background-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .pane-header__label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .pane-header__label-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 6px var(--success);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        .editor-pane .pane-header__label-dot {
            background: var(--primary);
            box-shadow: 0 0 6px var(--primary);
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .pane-header__stats {
            font-size: 0.7rem;
            color: var(--text-disabled);
            font-variant-numeric: tabular-nums;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .pane-header__stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pane-header__stat i {
            font-size: 0.65rem;
            opacity: 0.6;
        }

        /* ---- Textarea ---- */
        .editor-textarea {
            flex: 1;
            width: 100%;
            padding: var(--space-md) var(--space-lg);
            background: transparent;
            border: none;
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 13.5px;
            line-height: 1.75;
            resize: none;
            outline: none;
            tab-size: 4;
            overflow-y: auto;
        }

        .editor-textarea::placeholder {
            color: var(--text-disabled);
            font-style: italic;
        }

        /* ---- Custom Scrollbar ---- */
        .editor-textarea::-webkit-scrollbar,
        .preview-content::-webkit-scrollbar {
            width: 6px;
        }

        .editor-textarea::-webkit-scrollbar-track,
        .preview-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .editor-textarea::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .editor-textarea::-webkit-scrollbar-thumb:hover {
            background: var(--border-light);
        }

        .preview-content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .preview-content::-webkit-scrollbar-thumb:hover {
            background: var(--border-light);
        }

        /* ---- Preview ---- */
        .preview-content {
            flex: 1;
            padding: var(--space-md) var(--space-xl);
            overflow-y: auto;
            background: var(--surface);
        }

        /* ---- Preview Markdown Styles ---- */
        .preview-content h1,
        .preview-content h2,
        .preview-content h3,
        .preview-content h4 {
            color: var(--text);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.3;
        }

        .preview-content h1:first-child,
        .preview-content h2:first-child,
        .preview-content h3:first-child {
            margin-top: 0;
        }

        .preview-content h1 {
            font-size: 1.75rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
            margin-top: 2rem;
            margin-bottom: 0.8rem;
        }

        .preview-content h2 {
            font-size: 1.35rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.35rem;
            margin-top: 1.8rem;
            margin-bottom: 0.6rem;
            color: var(--primary);
        }

        .preview-content h3 {
            font-size: 1.1rem;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .preview-content h4 {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-top: 1.2rem;
        }

        .preview-content p {
            margin: 0.5rem 0;
            color: var(--text-secondary);
        }

        .preview-content a {
            color: var(--primary);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color var(--transition-slow);
        }

        .preview-content a:hover {
            border-bottom-color: var(--primary);
        }

        .preview-content strong {
            color: var(--text);
            font-weight: 600;
        }

        .preview-content code {
            background: var(--background);
            color: var(--accent);
            padding: 0.15em 0.45em;
            font-size: 0.85em;
            border-radius: var(--radius-xs);
            font-family: var(--font-mono);
            border: 1px solid var(--border);
        }

        .preview-content pre {
            background: var(--background);
            border: 1px solid var(--border);
            padding: var(--space-md) var(--space-lg);
            border-radius: var(--radius-md);
            overflow-x: auto;
            margin: 1rem 0;
            position: relative;
        }

        .preview-content pre code {
            padding: 0;
            background: none;
            color: var(--text);
            font-size: 0.82rem;
            text-align: left;
            border: none;
            line-height: 1.65;
        }

        .preview-content blockquote {
            border-left: 3px solid var(--primary);
            padding-left: var(--space-md);
            color: var(--text-muted);
            margin: 1rem 0;
            background: color-mix(in srgb, var(--primary) 4%, transparent);
            padding: var(--space-sm) var(--space-md) var(--space-sm) var(--space-md);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            font-style: italic;
        }

        .preview-content blockquote p {
            color: var(--text-muted);
            margin: 0.3rem 0;
        }

        .preview-content ul,
        .preview-content ol {
            padding-left: 1.5rem;
            color: var(--text-secondary);
        }

        .preview-content li {
            margin: 0.2rem 0;
        }

        .preview-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.5rem 0;
        }

        .preview-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1rem 0;
            font-size: 0.85rem;
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .preview-content th,
        .preview-content td {
            border: 1px solid var(--border);
            padding: 8px var(--space-md);
            text-align: left;
        }

        .preview-content th {
            background: var(--background-secondary);
            font-weight: 600;
            color: var(--text);
        }

        .preview-content tr:nth-child(even) td {
            background: rgba(255, 255, 255, 0.015);
        }

        .preview-content img {
            max-width: 100%;
            border-radius: var(--radius-md);
        }

        .preview-content input[type="checkbox"] {
            margin-right: 6px;
            accent-color: var(--primary);
        }

        /* ---- Toast notification ---- */
        .editor-toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 10px 22px;
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            color: var(--text);
            font-size: 0.8rem;
            font-weight: 500;
            box-shadow: var(--shadow-2xl);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 9999;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .editor-toast--visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .editor-toast--success { border-color: color-mix(in srgb, var(--success) 30%, transparent); }
        .editor-toast--success i { color: var(--success); }
        .editor-toast--error { border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
        .editor-toast--error i { color: var(--danger); }

        /* ---- Responsive ---- */
        @media (max-width: 1024px) {
            .editor-split {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }

            .editor-pane {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }

        @media (max-width: 768px) {
            .editor-page {
                padding: var(--space-md) var(--space-sm);
                gap: var(--space-sm);
            }

            .editor-toolbar {
                padding: 6px 10px;
                gap: 4px;
                border-radius: var(--radius-lg);
            }

            .toolbar-btn {
                padding: 4px 7px;
                min-width: 26px;
                min-height: 26px;
                font-size: 0.7rem;
            }

            .toolbar-group {
                padding: 2px;
                gap: 1px;
            }

            .toolbar-divider {
                display: none;
            }

            .editor-header__title {
                font-size: 1.1rem;
            }

            .toolbar-btn__label {
                display: none;
            }

            .editor-textarea {
                font-size: 13px;
                padding: var(--space-sm) var(--space-md);
            }

            .preview-content {
                padding: var(--space-sm) var(--space-md);
            }
        }
    </style>
</head>

<body>
    <div class="editor-page">

        <!-- Header -->
        <header class="editor-header">
            <div class="editor-header__left">
                <a href="../notes.html" class="editor-header__back">
                    <i class="fas fa-arrow-left"></i> 返回索引
                </a>
                <h1 class="editor-header__title">
                    <span class="editor-header__title-icon"><i class="fas fa-pen-nib"></i></span>
                    Markdown 编辑器
                </h1>
            </div>
            <div class="editor-header__meta">
                <span class="editor-visit-badge" id="visit-badge">
                    <i class="fas fa-eye"></i> <span id="visit-count">0</span>
                </span>
                <button class="editor-header__widget-btn" id="editor-lang-btn" title="切换语言">
                    <i class="fas fa-globe"></i>
                </button>
                <button class="editor-header__widget-btn" id="editor-theme-btn" title="切换主题">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="editor-header__widget-btn" id="editor-share-btn" title="复制链接">
                    <i class="fas fa-share-nodes"></i>
                </button>
            </div>
        </header>

        <!-- Toolbar -->
        <div class="editor-toolbar">
            <div class="toolbar-group">
                <button class="toolbar-btn toolbar-btn--icon-only" id="clear-btn" title="清空内容 (Ctrl+K)">
                    <i class="fas fa-trash-can"></i>
                </button>
                <button class="toolbar-btn toolbar-btn--icon-only" id="copy-btn" title="复制全部内容">
                    <i class="fas fa-copy"></i>
                </button>
                <button class="toolbar-btn toolbar-btn--icon-only" id="paste-btn" title="从剪贴板粘贴">
                    <i class="fas fa-paste"></i>
                </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
                <button class="toolbar-btn toolbar-btn--icon-only" id="btn-h1" title="标题 1"><i class="fas fa-heading"></i><span class="toolbar-btn__label">1</span></button>
                <button class="toolbar-btn toolbar-btn--icon-only" id="btn-h2" title="标题 2"><i class="fas fa-heading"></i><span class="toolbar-btn__label">2</span></button>
                <button class="toolbar-btn toolbar-btn--icon-only" id="btn-h3" title="标题 3"><i class="fas fa-heading"></i><span class="toolbar-btn__label">3</span></button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
                <button class="toolbar-btn toolbar-btn--icon-only" id="btn-bold" title="粗体"><i class="fas fa-bold"></i></button>
                <button class="toolbar-btn toolbar-btn--icon-only" id="btn-italic" title="斜体"><i class="fas fa-italic"></i></button>
                <button class="toolbar-btn toolbar-btn--icon-only" id="btn-strikethrough" title="删除线"><i class="fas fa-strikethrough"></i></button>
                <button class="toolbar-btn toolbar-btn--icon-only" id="btn-code" title="行内代码"><i class="fas fa-code"></i></button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
                <button class="toolbar-btn toolbar-btn--icon-only" id="btn-quote" title="引用"><i class="fas fa-quote-left"></i></button>
                <button class="toolbar-btn toolbar-btn--icon-only" id="btn-link" title="链接"><i class="fas fa-link"></i></button>
                <button class="toolbar-btn toolbar-btn--icon-only" id="btn-image" title="图片"><i class="fas fa-image"></i></button>
                <button class="toolbar-btn toolbar-btn--icon-only" id="btn-list-ul" title="无序列表"><i class="fas fa-list-ul"></i></button>
                <button class="toolbar-btn toolbar-btn--icon-only" id="btn-list-ol" title="有序列表"><i class="fas fa-list-ol"></i></button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
                <button class="toolbar-btn toolbar-btn--icon-only" id="btn-table" title="表格"><i class="fas fa-table"></i></button>
                <button class="toolbar-btn toolbar-btn--icon-only" id="btn-hr" title="分割线"><i class="fas fa-minus"></i></button>
            </div>
        </div>

        <!-- Split Pane -->
        <div class="editor-split">

            <!-- Editor -->
            <div class="editor-pane">
                <div class="pane-header">
                    <span class="pane-header__label"><span class="pane-header__label-dot"></span> 编辑</span>
                    <div class="pane-header__stats">
                        <span class="pane-header__stat"><i class="fas fa-grip-lines"></i> <span id="stat-lines">0</span></span>
                        <span class="pane-header__stat"><i class="fas fa-font"></i> <span id="stat-chars">0</span></span>
                        <span class="pane-header__stat"><i class="fas fa-clock"></i> <span id="stat-words">0</span></span>
                    </div>
                </div>
                <textarea class="editor-textarea" id="markdown-editor" spellcheck="false" placeholder="在此输入 Markdown 文本，右侧实时预览..."></textarea>
            </div>

            <!-- Preview -->
            <div class="preview-pane">
                <div class="pane-header">
                    <span class="pane-header__label"><span class="pane-header__label-dot"></span> 预览</span>
                    <div class="pane-header__stats">
                        <span class="pane-header__stat"><i class="fas fa-sync-alt" style="font-size: 0.6rem; opacity: 0.5;"></i> 实时同步</span>
                    </div>
                </div>
                <div class="preview-content" id="preview-content"></div>
            </div>

        </div>
    </div>

    <!-- Toast -->
    <div class="editor-toast" id="toast"></div>

    <!-- Marked.js -->
    <script defer src="https://cdnjs.loli.net/ajax/libs/marked/9.1.2/marked.min.js"></script>

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true,
                tags: 'ams',
                packages: { '[+]': ['ams'] },
                macros: {
                    RR: '{\\mathbb{R}}',
                    dd: '{\\,\\mathrm{d}}',
                    e: '{\\mathrm{e}}'
                }
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script defer id="MathJax-script" src="https://cdnjs.loli.net/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>

    <script>
        /* ================================
           Markdown Editor — Logic
           ================================ */

        const editor   = document.getElementById('markdown-editor');
        const preview  = document.getElementById('preview-content');
        const toast    = document.getElementById('toast');
        const linesEl  = document.getElementById('stat-lines');
        const charsEl  = document.getElementById('stat-chars');
        const wordsEl  = document.getElementById('stat-words');
        const visitEl  = document.getElementById('visit-count');

        // ---- Default Content ----
        const DEFAULT_CONTENT = `# Markdown 语法指南

欢迎来到 Markdown 学习笔记。Markdown 是一种轻量级标记语言，让你能够使用易于阅读、易于编写的纯文本格式编写文档。

---

## 1. 标题 (Headers)

使用 \`#\` 号可以创建标题，\`#\` 的数量代表标题的级别。

\`\`\`markdown
# 这是一级标题
## 这是二级标题
### 这是三级标题
#### 这是四级标题
##### 这是五级标题
###### 这是六级标题
\`\`\`

---

## 2. 文本样式 (Text Styling)

- **粗体**: 使用两个星号 \`**\` 或两个下划线 \`__\`
- *斜体*: 使用一个星号 \`*\` 或一个下划线 \`_\`
- ~~删除线~~: 使用两个波浪线 \`~~\`

\`\`\`markdown
**这是粗体文本**
*这是斜体文本*
~~这是带删除线的文本~~
***这是粗斜体文本***
\`\`\`

---

## 3. 列表 (Lists)

### 无序列表

使用星号 \`*\`、加号 \`+\` 或减号 \`-\` 来创建无序列表。

\`\`\`markdown
* 苹果
* 香蕉
  * 红香蕉
  * 绿香蕉
* 橙子
\`\`\`

### 有序列表

使用数字加 \`. \` 来创建有序列表。

\`\`\`markdown
1. 第一步
2. 第二步
3. 第三步
\`\`\`

---

## 4. 链接 (Links)

\`\`\`markdown
[访问我的GitHub主页](https://github.com/NEGIAO)
\`\`\`

**效果:** [访问我的GitHub主页](https://github.com/NEGIAO)

---

## 5. 图片 (Images)

\`\`\`markdown
![GitHub Logo](https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.webp)
\`\`\`

**效果:** ![GitHub Logo](https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.webp)

---

## 6. 代码 (Code)

### 行内代码

\`\`\`markdown
在 JavaScript 中，使用 \`console.log()\` 来打印信息。
\`\`\`

**效果:** 在 JavaScript 中，使用 \`console.log()\` 来打印信息。

### 代码块

\`\`\`javascript
function greet(name) {
  console.log('Hello, ' + name + '!');
}
greet('World');
\`\`\`

---

## 7. 引用 (Blockquotes)

**效果:**
> 这是一段引用。
> > 引用可以嵌套。
>
> —— 引用出处

---

## 8. 表格 (Tables)

| 左对齐 | 居中对齐 | 右对齐 |
| :--- | :---: | ---: |
| 单元格1 | 单元格2 | 单元格3 |
| 单元格4 | 单元格5 | 单元格6 |

---

## 9. 分割线

---
***
___

---

## 10. 任务列表 (Task Lists)

- [x] 完成 Markdown 语法学习
- [ ] 开始撰写新的笔记
- [ ] 部署更新到 GitHub Pages

---

## 11. 数学公式 (LaTeX)

### 11.1 行内公式

函数 $f(x)=x^2+1$ 在 $x=0$ 处取值为 $1$。

### 11.2 块级公式

$$
\\lim_{x\\to 0}\\frac{\\sin x}{x}=1
$$

### 11.3 多行推导（对齐）

$$
\\begin{aligned}
\\int_0^1 x^2\\dd x &= \\frac{1}{3} \\\\
\\frac{d}{dx}(x^3) &= 3x^2
\\end{aligned}
$$

### 11.4 常见结构模板

分段函数：

$$
f(x)=\\begin{cases}
x^2, & x\\ge 0 \\\\
-x, & x<0
\\end{cases}
$$

矩阵：

$$
A=\\begin{bmatrix}
1 & 2 \\\\
3 & 4
\\end{bmatrix}
$$

### 11.5 AMS 自动编号

$$
\\int_a^b f(x)\\dd x = F(b)-F(a)
$$

### 11.6 编辑器内置快捷宏

当前支持这些快捷宏：
- \`$\\RR$\` 表示实数域
- \`$\\dd$\` 表示微分符号
- \`$\\e^x$\` 表示自然指数

$$
f: \\RR \\to \\RR,\\quad \\int_0^1 \\e^x\\dd x = \\e-1
$$

这只是 Markdown 的基础功能，但已经足够满足大部分日常的文档编写需求。`;

        // ---- Render ----
        let mathTimer = null;

        function renderPreview() {
            if (!window.marked) return;
            preview.innerHTML = window.marked.parse(editor.value);
            scheduleMathRender();
            updateStats();
        }

        function scheduleMathRender() {
            if (mathTimer) clearTimeout(mathTimer);
            mathTimer = setTimeout(() => {
                let retries = 0;
                const max = 80;
                function attempt() {
                    if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
                        if (typeof window.MathJax.typesetClear === 'function') {
                            window.MathJax.typesetClear([preview]);
                        }
                        window.MathJax.typesetPromise([preview]).catch(() => {});
                        return;
                    }
                    if (retries < max) { retries++; setTimeout(attempt, 50); }
                }
                attempt();
            }, 120);
        }

        function updateStats() {
            const text = editor.value;
            const lines = text.split('\n').length;
            const chars = text.length;
            // Rough word count: CJK chars + space-separated tokens
            const cjk = (text.match(/[一-鿿]/g) || []).length;
            const latin = (text.match(/[a-zA-Z]+/g) || []).length;
            linesEl.textContent = lines;
            charsEl.textContent = chars;
            wordsEl.textContent = cjk + latin;
        }

        // ---- Toast ----
        let toastTimer = null;
        function showToast(message, type) {
            if (toastTimer) clearTimeout(toastTimer);
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            toast.innerHTML = '<i class="fas ' + icon + '"></i> ' + message;
            toast.className = 'editor-toast editor-toast--visible editor-toast--' + type;
            toastTimer = setTimeout(() => {
                toast.classList.remove('editor-toast--visible');
            }, 2200);
        }

        // ---- Toolbar Actions ----
        function insertMarkdown(before, after, placeholder) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const selected = editor.value.substring(start, end) || placeholder;
            const insert = before + selected + after;
            editor.value = editor.value.substring(0, start) + insert + editor.value.substring(end);
            editor.selectionStart = start + before.length;
            editor.selectionEnd = start + before.length + selected.length;
            editor.focus();
            renderPreview();
        }

        document.getElementById('clear-btn').addEventListener('click', function () {
            if (!editor.value.trim()) return;
            if (confirm('确定要清空编辑器内容吗？此操作无法撤销。')) {
                editor.value = '';
                renderPreview();
                editor.focus();
                showToast('已清空', 'success');
            }
        });

        document.getElementById('copy-btn').addEventListener('click', async function () {
            try {
                await navigator.clipboard.writeText(editor.value);
                showToast('已复制到剪贴板', 'success');
            } catch (err) {
                showToast('复制失败，请手动选择复制', 'error');
            }
        });

        document.getElementById('paste-btn').addEventListener('click', async function () {
            try {
                const text = await navigator.clipboard.readText();
                const pos = editor.selectionStart;
                editor.value = editor.value.substring(0, pos) + text + editor.value.substring(editor.selectionEnd);
                editor.selectionStart = editor.selectionEnd = pos + text.length;
                renderPreview();
                editor.focus();
                showToast('已粘贴', 'success');
            } catch (err) {
                showToast('粘贴失败，请使用 Ctrl+V', 'error');
            }
        });

        // Inline formatting buttons
        document.getElementById('btn-h1').addEventListener('click', () => insertMarkdown('# ', '', '标题'));
        document.getElementById('btn-h2').addEventListener('click', () => insertMarkdown('## ', '', '标题'));
        document.getElementById('btn-h3').addEventListener('click', () => insertMarkdown('### ', '', '标题'));
        document.getElementById('btn-bold').addEventListener('click', () => insertMarkdown('**', '**', '粗体'));
        document.getElementById('btn-italic').addEventListener('click', () => insertMarkdown('*', '*', '斜体'));
        document.getElementById('btn-strikethrough').addEventListener('click', () => insertMarkdown('~~', '~~', '删除线'));
        document.getElementById('btn-code').addEventListener('click', () => insertMarkdown('`', '`', 'code'));
        document.getElementById('btn-quote').addEventListener('click', () => insertMarkdown('> ', '', '引用内容'));
        document.getElementById('btn-link').addEventListener('click', () => insertMarkdown('[', '](https://)', '链接文字'));
        document.getElementById('btn-image').addEventListener('click', () => insertMarkdown('![', '](https://example.com/image.png)', 'alt文本'));
        document.getElementById('btn-list-ul').addEventListener('click', () => insertMarkdown('- ', '', '列表项'));
        document.getElementById('btn-list-ol').addEventListener('click', () => insertMarkdown('1. ', '', '列表项'));
        document.getElementById('btn-table').addEventListener('click', () => insertMarkdown('| 列1 | 列2 | 列3 |\n| :--- | :---: | ---: |\n|  |  |  |\n', ''));
        document.getElementById('btn-hr').addEventListener('click', () => insertMarkdown('\n---\n', '', ''));

        // ---- Keyboard Shortcuts ----
        editor.addEventListener('keydown', function (e) {
            if (e.ctrlKey && e.key === 'k') {
                e.preventDefault();
                document.getElementById('clear-btn').click();
            }
            if (e.ctrlKey && e.key === 'b') {
                e.preventDefault();
                document.getElementById('btn-bold').click();
            }
            if (e.ctrlKey && e.key === 'i') {
                e.preventDefault();
                document.getElementById('btn-italic').click();
            }
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
                renderPreview();
            }
        });

        // ---- Clipboard API check ----
        if (!navigator.clipboard || !navigator.clipboard.readText) {
            document.getElementById('paste-btn').disabled = true;
            document.getElementById('paste-btn').title = '此浏览器不支持剪贴板 API';
        }

        // ---- Sync Scroll ----
        let syncing = false;

        editor.addEventListener('scroll', function () {
            if (syncing) return;
            syncing = true;
            const range = editor.scrollHeight - editor.clientHeight;
            if (range > 0) {
                const ratio = editor.scrollTop / range;
                preview.scrollTop = ratio * (preview.scrollHeight - preview.clientHeight);
            }
            requestAnimationFrame(() => { syncing = false; });
        });

        preview.addEventListener('scroll', function () {
            if (syncing) return;
            syncing = true;
            const range = preview.scrollHeight - preview.clientHeight;
            if (range > 0) {
                const ratio = preview.scrollTop / range;
                editor.scrollTop = ratio * (editor.scrollHeight - editor.clientHeight);
            }
            requestAnimationFrame(() => { syncing = false; });
        });

        // ---- Visit Counter ----
        function trackVisit() {
            let n = parseInt(localStorage.getItem('md_editor_visits') || '0', 10) + 1;
            localStorage.setItem('md_editor_visits', n);
            visitEl.textContent = n;
        }

        // ---- Init ----
        document.addEventListener('DOMContentLoaded', () => {
            editor.value = DEFAULT_CONTENT.trim();
            renderPreview();
            trackVisit();
            initHeaderWidgets();
        });

        /* ================================
           Header Widget Buttons
           ================================ */

        var THEME_KEY = 'site-theme';
        var LANG_KEY  = 'negiao.preferred-lang';

        function initHeaderWidgets() {
            var themeBtn = document.getElementById('editor-theme-btn');
            var langBtn  = document.getElementById('editor-lang-btn');
            var shareBtn = document.getElementById('editor-share-btn');

            // 主题切换
            function getTheme() {
                var s = localStorage.getItem(THEME_KEY);
                if (s === 'light' || s === 'dark') return s;
                // 默认暗色：只有显式切换过才记住，不跟随系统偏好
                return 'dark';
            }
            function applyTheme(t) {
                document.body.dataset.theme = t;
                localStorage.setItem(THEME_KEY, t);
                var icon = themeBtn.querySelector('i');
                icon.classList.remove('fa-sun', 'fa-moon');
                icon.classList.add(t === 'dark' ? 'fa-sun' : 'fa-moon');
                themeBtn.setAttribute('title', t === 'dark' ? '切换到浅色主题' : '切换到深色主题');
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', t === 'dark' ? '#0D1117' : '#EFF1F5');
            }
            applyTheme(getTheme());
            themeBtn.addEventListener('click', function () {
                applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
            });

            // 语言切换
            function getLang() {
                var s = localStorage.getItem(LANG_KEY);
                return s === 'en' ? 'en' : 'zh';
            }
            function applyLang(lang) {
                localStorage.setItem(LANG_KEY, lang);
                langBtn.textContent = lang === 'en' ? '中' : 'EN';
                langBtn.setAttribute('title', lang === 'en' ? '切换到中文' : 'Switch to English');
            }
            applyLang(getLang());
            langBtn.addEventListener('click', function () {
                applyLang(getLang() === 'en' ? 'zh' : 'en');
            });

            // 分享
            shareBtn.addEventListener('click', function () {
                var done = function () {
                    shareBtn.innerHTML = '<i class="fas fa-check"></i>';
                    shareBtn.classList.add('copied');
                    setTimeout(function () {
                        shareBtn.innerHTML = '<i class="fas fa-share-nodes"></i>';
                        shareBtn.classList.remove('copied');
                    }, 1500);
                };
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(window.location.href).then(done).catch(done);
                } else {
                    var input = document.createElement('input');
                    input.value = window.location.href;
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    document.body.removeChild(input);
                    done();
                }
            });
        }

        editor.addEventListener('input', renderPreview);
    </script>
