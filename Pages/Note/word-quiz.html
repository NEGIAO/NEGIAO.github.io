<html lang="zh-CN">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NEGIAO英语单词测试系统 - 随机测验，巩固记忆">
    <meta name="author" content="NEGIAO">
    <meta name="theme-color" content="#0A0E13">

    <title>单词测试 - NEGIAO</title>

    <link rel="stylesheet" href="https://cdnjs.loli.net/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* ============================
           Word Quiz - Modern Glass UI
           ============================ */

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--background);
        }

        /* ---- Layout ---- */
        .quiz-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-xl) var(--space-md);
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
            gap: var(--space-xl);
        }

        /* ---- Header ---- */
        .quiz-header {
            text-align: center;
        }

        .quiz-header__icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: var(--radius-xl);
            background: var(--gradient-primary);
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: var(--space-md);
            box-shadow: var(--shadow-glow);
        }

        .quiz-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text);
            margin: 0;
            letter-spacing: -0.02em;
        }

        .quiz-header p {
            color: var(--text-muted);
            margin-top: var(--space-xs);
            font-size: 0.9rem;
        }

        /* ---- Main Card (Glass) ---- */
        .quiz-card {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-2xl);
            box-shadow: var(--glass-shadow);
            padding: var(--space-2xl);
            position: relative;
            overflow: hidden;
        }

        /* subtle top accent line */
        .quiz-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-primary);
            border-radius: 3px 3px 0 0;
        }

        /* ---- Progress ---- */
        .quiz-progress {
            display: none;
            margin-bottom: var(--space-lg);
        }

        .quiz-progress__bar {
            height: 4px;
            background: var(--surface-elevated);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .quiz-progress__fill {
            height: 100%;
            background: var(--gradient-primary);
            border-radius: var(--radius-full);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .quiz-progress__text {
            text-align: right;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: var(--space-xs);
            font-variant-numeric: tabular-nums;
        }

        /* ---- Stats Row ---- */
        .quiz-stats {
            display: flex;
            justify-content: center;
            gap: var(--space-md);
            margin-bottom: var(--space-xl);
            flex-wrap: wrap;
        }

        .quiz-stat {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            padding: var(--space-xs) var(--space-md);
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all var(--transition-slow);
        }

        .quiz-stat i {
            font-size: 0.75rem;
        }

        .quiz-stat--correct i { color: var(--success); }
        .quiz-stat--wrong i   { color: var(--danger); }
        .quiz-stat--acc i     { color: var(--primary); }

        .quiz-stat__value {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            color: var(--text);
        }

        /* ---- Word Display ---- */
        .quiz-word-area {
            text-align: center;
            margin-bottom: var(--space-xl);
        }

        .quiz-word {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.03em;
            line-height: 1.2;
            margin: 0;
            transition: opacity 0.3s ease;
        }

        .quiz-word--placeholder {
            color: var(--text-disabled);
            font-weight: 600;
        }

        .quiz-hint {
            margin-top: var(--space-sm);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* ---- Options Grid ---- */
        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-sm);
            margin-bottom: var(--space-xl);
        }

        .quiz-option {
            position: relative;
            padding: var(--space-md) var(--space-lg);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-lg);
            background: var(--surface);
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-slow);
            text-align: center;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
            overflow: hidden;
        }

        .quiz-option:hover:not(.quiz-option--disabled) {
            border-color: var(--primary);
            background: var(--surface-elevated);
            color: var(--text);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 217, 255, 0.12);
        }

        .quiz-option:active:not(.quiz-option--disabled) {
            transform: translateY(0);
        }

        /* Correct */
        .quiz-option--correct {
            border-color: var(--success) !important;
            background: rgba(81, 207, 102, 0.12) !important;
            color: var(--success) !important;
            box-shadow: 0 0 20px rgba(81, 207, 102, 0.15);
        }

        /* Wrong */
        .quiz-option--wrong {
            border-color: var(--danger) !important;
            background: rgba(255, 107, 107, 0.12) !important;
            color: var(--danger) !important;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.15);
        }

        /* Disabled after answer */
        .quiz-option--disabled {
            pointer-events: none;
            opacity: 0.5;
        }

        .quiz-option--correct.quiz-option--disabled,
        .quiz-option--wrong.quiz-option--disabled {
            opacity: 1;
        }

        /* ---- Feedback Toast ---- */
        .quiz-feedback {
            display: none;
            text-align: center;
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: var(--space-md);
            animation: feedbackSlide 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .quiz-feedback--correct {
            background: rgba(81, 207, 102, 0.1);
            color: var(--success);
            border: 1px solid rgba(81, 207, 102, 0.25);
        }

        .quiz-feedback--wrong {
            background: rgba(255, 107, 107, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 107, 107, 0.25);
        }

        @keyframes feedbackSlide {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---- Controls ---- */
        .quiz-controls {
            display: flex;
            gap: var(--space-sm);
            justify-content: center;
            flex-wrap: wrap;
        }

        .quiz-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            padding: var(--space-sm) var(--space-lg);
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-slow);
            white-space: nowrap;
        }

        .quiz-btn--primary {
            background: var(--gradient-primary);
            color: #fff;
            box-shadow: var(--shadow-glow);
        }

        .quiz-btn--primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 217, 255, 0.35);
        }

        .quiz-btn--secondary {
            background: var(--surface-elevated);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .quiz-btn--secondary:hover {
            background: var(--surface-hover);
            color: var(--text);
            border-color: var(--border-light);
        }

        .quiz-btn--ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1.5px solid var(--border);
        }

        .quiz-btn--ghost:hover {
            color: var(--primary);
            border-color: var(--primary);
            background: rgba(0, 217, 255, 0.05);
        }

        .quiz-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ---- Footer ---- */
        .quiz-footer {
            text-align: center;
        }

        .quiz-footer a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color var(--transition-slow);
        }

        .quiz-footer a:hover {
            color: var(--primary);
        }

        /* ---- Loading Spinner ---- */
        .quiz-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: quizSpin 0.8s linear infinite;
        }

        @keyframes quizSpin {
            to { transform: rotate(360deg); }
        }

        /* ---- Word reveal animation ---- */
        @keyframes wordReveal {
            from { opacity: 0; transform: translateY(12px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .quiz-word--reveal {
            animation: wordReveal 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ---- Option stagger animation ---- */
        @keyframes optionFadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .quiz-option {
            animation: optionFadeUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        .quiz-option:nth-child(1) { animation-delay: 0.05s; }
        .quiz-option:nth-child(2) { animation-delay: 0.10s; }
        .quiz-option:nth-child(3) { animation-delay: 0.15s; }
        .quiz-option:nth-child(4) { animation-delay: 0.20s; }

        /* ---- Responsive ---- */
        @media (max-width: 600px) {
            .quiz-layout {
                padding: var(--space-lg) var(--space-sm);
                gap: var(--space-lg);
            }

            .quiz-card {
                padding: var(--space-lg);
                border-radius: var(--radius-xl);
            }

            .quiz-word {
                font-size: 2rem;
            }

            .quiz-options {
                grid-template-columns: 1fr;
            }

            .quiz-stats {
                gap: var(--space-sm);
            }

            .quiz-header h1 {
                font-size: 1.4rem;
            }
        }
    </style>

<body>
    <nav class="navbar">
        <div class="navbar__container">
            <a href="../../index.html" class="navbar__brand">NEGIAO</a>
            <a href="note-viewer/note-viewer.html?note=word-learning-record" class="navbar-nav-btn" aria-label="查看词库">
                <span class="navbar-nav-btn__icon" aria-hidden="true"><i class="fas fa-book"></i></span>
                <span class="navbar-nav-btn__text">查看词库</span>
            </a>
        </div>
    </nav>

    <main class="quiz-layout">

        <!-- Header -->
        <header class="quiz-header">
            <div class="quiz-header__icon"><i class="fas fa-bullseye"></i></div>
            <h1>单词测试</h1>
            <p>随机抽测 · 即时反馈 · 巩固记忆</p>
        </header>

        <!-- Main Card -->
        <div class="quiz-card">

            <!-- Progress -->
            <div class="quiz-progress" id="progress-container">
                <div class="quiz-progress__bar">
                    <div class="quiz-progress__fill" id="progress-fill" style="width: 0%"></div>
                </div>
                <div class="quiz-progress__text" id="progress-text">已答 0 题</div>
            </div>

            <!-- Stats -->
            <div class="quiz-stats">
                <div class="quiz-stat quiz-stat--correct">
                    <i class="fas fa-check-circle"></i>
                    正确 <span class="quiz-stat__value" id="correct-count">0</span>
                </div>
                <div class="quiz-stat quiz-stat--wrong">
                    <i class="fas fa-times-circle"></i>
                    错误 <span class="quiz-stat__value" id="wrong-count">0</span>
                </div>
                <div class="quiz-stat quiz-stat--acc">
                    <i class="fas fa-chart-pie"></i>
                    准确率 <span class="quiz-stat__value" id="accuracy">0%</span>
                </div>
            </div>

            <!-- Word -->
            <div class="quiz-word-area">
                <h2 class="quiz-word quiz-word--placeholder" id="test-word">准备开始</h2>
                <p class="quiz-hint" id="question-text">点击下方按钮开始测试</p>
            </div>

            <!-- Options -->
            <div class="quiz-options" id="test-options"></div>

            <!-- Feedback -->
            <div class="quiz-feedback" id="test-result"></div>

            <!-- Controls -->
            <div class="quiz-controls">
                <button id="start-test-btn" class="quiz-btn quiz-btn--primary">
                    <i class="fas fa-play"></i> 开始测试
                </button>
                <button id="next-word-btn" class="quiz-btn quiz-btn--primary" style="display: none;">
                    <i class="fas fa-arrow-right"></i> 下一题
                </button>
                <button id="reset-btn" class="quiz-btn quiz-btn--ghost" style="display: none;">
                    <i class="fas fa-rotate-left"></i> 重新开始
                </button>
            </div>

        </div>

        <!-- Footer -->
        <footer class="quiz-footer">
            <a href="../notes.html"><i class="fas fa-arrow-left"></i> 返回笔记索引</a>
        </footer>

    </main>

    <script>
        /**
         * Word Quiz - Modern UI
         */
        class WordQuiz {
            constructor() {
                this.words = [];
                this.currentWord = null;
                this.correctCount = 0;
                this.wrongCount = 0;
                this.totalAnswered = 0;
                this.isAnswered = false;

                this.fallbackWords = [
                    { word: 'sanction', meaning: '制裁；批准', options: ['制裁；批准', '伪造', '逃避', '景象'] },
                    { word: 'forge', meaning: '伪造；锻造', options: ['伪造；锻造', '蔓延', '高潮', '共谋'] },
                    { word: 'mitigate', meaning: '缓解；减轻', options: ['缓解；减轻', '华丽的', '紧握', '需要'] },
                    { word: 'exacerbate', meaning: '使恶化；加剧', options: ['使恶化；加剧', '健康的', '支持', '罪犯'] },
                    { word: 'deplete', meaning: '耗尽；削减', options: ['耗尽；削减', '有毒的', '夜间活动的', '偏好'] },
                    { word: 'negligible', meaning: '微不足道的', options: ['微不足道的', '疏忽的', '看似合理的', '宇宙的'] },
                    { word: 'formulate', meaning: '制定；阐述', options: ['制定；阐述', '旋转', '潜在的', '领域'] },
                    { word: 'realm', meaning: '领域', options: ['领域', '源于', '保护', '诱惑'] }
                ];

                this.initElements();
                this.bindEvents();
                this.loadWords();
            }

            initElements() {
                this.testWord = document.getElementById('test-word');
                this.questionText = document.getElementById('question-text');
                this.testOptions = document.getElementById('test-options');
                this.nextBtn = document.getElementById('next-word-btn');
                this.startBtn = document.getElementById('start-test-btn');
                this.resetBtn = document.getElementById('reset-btn');
                this.testResult = document.getElementById('test-result');
                this.correctCountEl = document.getElementById('correct-count');
                this.wrongCountEl = document.getElementById('wrong-count');
                this.accuracyEl = document.getElementById('accuracy');
                this.progressContainer = document.getElementById('progress-container');
                this.progressFill = document.getElementById('progress-fill');
                this.progressText = document.getElementById('progress-text');
            }

            bindEvents() {
                this.startBtn.addEventListener('click', () => this.startTest());
                this.nextBtn.addEventListener('click', () => this.nextQuestion());
                this.resetBtn.addEventListener('click', () => this.resetTest());
            }

            async loadWords() {
                this.startBtn.disabled = true;
                this.startBtn.innerHTML = '<span class="quiz-spinner"></span> 加载词库中...';

                try {
                    const resp = await fetch('./word-list.json', { cache: 'no-store' });
                    if (!resp.ok) throw new Error('Failed to load');

                    const data = await resp.json();
                    this.words = (Array.isArray(data) ? data : []).map(item => ({
                        word: String(item.word || '').trim(),
                        meaning: String(item.meaning || '').trim(),
                        options: Array.isArray(item.options) && item.options.length
                            ? item.options.slice()
                            : [String(item.meaning || '').trim()]
                    })).filter(w => w.word && w.meaning);

                    if (this.words.length === 0) throw new Error('词库为空');
                } catch (err) {
                    console.warn('JSON加载失败，使用备用词库:', err);
                    this.words = this.fallbackWords;
                }

                this.startBtn.disabled = false;
                this.startBtn.innerHTML = '<i class="fas fa-play"></i> 开始测试 (' + this.words.length + '词)';
            }

            startTest() {
                if (this.words.length === 0) {
                    this.testWord.textContent = '词库加载失败';
                    return;
                }
                this.startBtn.style.display = 'none';
                this.resetBtn.style.display = 'inline-flex';
                this.progressContainer.style.display = 'block';
                this.nextQuestion();
            }

            nextQuestion() {
                this.isAnswered = false;
                this.testResult.style.display = 'none';
                this.nextBtn.style.display = 'none';

                this.currentWord = this.words[Math.floor(Math.random() * this.words.length)];

                // Reveal animation
                this.testWord.classList.remove('quiz-word--reveal');
                void this.testWord.offsetWidth; // reflow
                this.testWord.textContent = this.currentWord.word.toLowerCase();
                this.testWord.classList.remove('quiz-word--placeholder');
                this.testWord.classList.add('quiz-word--reveal');

                this.questionText.textContent = '请选择正确的中文含义';

                // Build options
                const optionSet = new Set(this.currentWord.options || []);
                optionSet.add(this.currentWord.meaning);

                if (optionSet.size < 4 && this.words.length > 4) {
                    const otherMeanings = this.words
                        .filter(w => w.word !== this.currentWord.word)
                        .map(w => w.meaning);
                    this.shuffleArray(otherMeanings);
                    for (const m of otherMeanings) {
                        if (optionSet.size >= 4) break;
                        optionSet.add(m);
                    }
                }

                const shuffled = this.shuffleArray(Array.from(optionSet));

                this.testOptions.innerHTML = '';
                shuffled.forEach(option => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-option';
                    btn.textContent = option;
                    btn.addEventListener('click', () => this.checkAnswer(option, btn));
                    this.testOptions.appendChild(btn);
                });
            }

            checkAnswer(selected, btnEl) {
                if (this.isAnswered) return;
                this.isAnswered = true;
                this.totalAnswered++;

                const correct = selected === this.currentWord.meaning;

                const allBtns = this.testOptions.querySelectorAll('.quiz-option');
                allBtns.forEach(btn => {
                    btn.classList.add('quiz-option--disabled');
                    if (btn.textContent === this.currentWord.meaning) {
                        btn.classList.add('quiz-option--correct');
                    } else if (btn === btnEl && !correct) {
                        btn.classList.add('quiz-option--wrong');
                    }
                });

                if (correct) {
                    this.correctCount++;
                    this.testResult.textContent = '回答正确！即将进入下一题...';
                    this.testResult.className = 'quiz-feedback quiz-feedback--correct';
                    setTimeout(() => this.nextQuestion(), 800);
                } else {
                    this.wrongCount++;
                    this.testResult.textContent = '回答错误 — 正确答案：' + this.currentWord.meaning;
                    this.testResult.className = 'quiz-feedback quiz-feedback--wrong';
                    this.nextBtn.style.display = 'inline-flex';
                }

                this.updateStats();
                this.testResult.style.display = 'block';
            }

            updateStats() {
                this.correctCountEl.textContent = this.correctCount;
                this.wrongCountEl.textContent = this.wrongCount;

                const total = this.correctCount + this.wrongCount;
                const acc = total > 0 ? Math.round((this.correctCount / total) * 100) : 0;
                this.accuracyEl.textContent = acc + '%';

                this.progressText.textContent = '已答 ' + this.totalAnswered + ' 题';
                const pct = (this.totalAnswered % 20) * 5;
                this.progressFill.style.width = pct + '%';
            }

            resetTest() {
                this.correctCount = 0;
                this.wrongCount = 0;
                this.totalAnswered = 0;
                this.isAnswered = false;

                this.correctCountEl.textContent = '0';
                this.wrongCountEl.textContent = '0';
                this.accuracyEl.textContent = '0%';
                this.progressFill.style.width = '0%';
                this.progressText.textContent = '已答 0 题';

                this.testWord.textContent = '准备开始';
                this.testWord.classList.add('quiz-word--placeholder');
                this.testWord.classList.remove('quiz-word--reveal');
                this.questionText.textContent = '点击下方按钮开始测试';
                this.testOptions.innerHTML = '';
                this.testResult.style.display = 'none';
                this.nextBtn.style.display = 'none';
                this.resetBtn.style.display = 'none';
                this.progressContainer.style.display = 'none';
                this.startBtn.style.display = 'inline-flex';
            }

            shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }
        }

        document.addEventListener('DOMContentLoaded', () => new WordQuiz());
    </script>
</body>
