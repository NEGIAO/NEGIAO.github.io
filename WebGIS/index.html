<!doctype html>
<html lang="zh-CN">
    <!--    
        NEGIAO's WebGIS
        联系作者：yaonaigao@qq.com
        GitHub: https://github.com/NEGIAO
        update:2026-10-31
        Version: 3.6.35
-->

    <head>
        <meta charset="UTF-8" />
        <!-- 隐藏 Referer 信息避免被跟踪 -->
        <!-- <meta name="referrer" content="no-referrer"> -->
        <!-- 品牌 icon.webp 同时作为 favicon 与首屏 logo <img>；
             二者同为同源请求，浏览器 HTTP 缓存会共享同一条响应，无需额外 preload。
             preload 因 credentials mode 与 favicon 不匹配反而产生一次冗余请求并触发
             控制台告警，已于 V3.6.35 移除（实测 icon 由 3 次请求降为缓存共享）。 -->
        <link
            rel="icon"
            href="./images/icon.webp"
            type="image/webp"
        />
        <!-- 自定义网页的logo：favicon / LandingView / TopBar / RegisterView 共用同一资源 -->

        <!-- LCP 纹样图预加载：该图作为 <img src> 由组件挂载后才出现，
             初始 HTML 不可发现，性能追踪实测造成约 480ms 的资源加载延迟。
             按断点分别预加载（仅命中其一），fetchpriority=high 提升抓取优先级。 -->
        <link
            rel="preload"
            href="./images/njnu-media/d-bg2_1.png"
            as="image"
            type="image/png"
            fetchpriority="high"
            media="(min-width: 768px)"
        />

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
        />
        <!-- 多设备自适应：shrink-to-fit=no 禁止 iOS Safari 在横向溢出时整页缩小（F12 模拟不会复现该行为）；
             viewport-fit=cover 适配刘海屏安全区 -->

        <!-- Font Awesome 6.4.0（BootCDN，国内节点）
             2026-11 回退：V3.6.35 曾改为自托管（public/fontawesome/，该目录已于 V3.6.40 删除），
             但自托管走的是本站源（GitHub Pages），国内访问反而比 BootCDN 慢，
             故改回 CDN。CSS 与字体同源于 cdn.bootcdn.net，一次 DNS 解析内并行取回。
             media="print" + onload 交换：CSS 异步加载不阻塞首屏（图标可能晚到约百毫秒）；
             noscript 兜底保证无 JS 环境仍能加载图标样式。 -->
        <link
            rel="preconnect"
            href="https://cdn.bootcdn.net"
            crossorigin
        />
        <link
            rel="stylesheet"
            href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            media="print"
            onload="this.media='all'; this.onload=null;"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            />
        </noscript>

        <title>NEGIAO's WebGIS</title>
        <!-- 本目录为 WebGIS 应用的历史静态拷贝；正式地址为独立域名 webgis.negiao.cn。
             canonical 指过去，避免与正式站点构成重复内容（V3.6.45 SEO 修复）。 -->
        <link
            rel="canonical"
            href="https://webgis.negiao.cn/"
        />
        <!-- Google Identity Services 不在此处加载：
             V3.6.35 起改由 RegisterView.vue 的 ensureGsiScript() 按需注入（仅登录/注册页），
             本文件曾遗留一个 async 的 <script>，会让落地页/地图页等无关页面
             也去连 accounts.google.com（国内不可达，白占连接槽并拖 load）。
             如需恢复预加载，先确认这一点是否仍成立。 -->
      <script type="module" crossorigin src="./assets/index-BqmLIluZ.js"></script>
      <link rel="modulepreload" crossorigin href="./assets/plugin-vue_export-helper-DlfxntA_.js">
      <link rel="modulepreload" crossorigin href="./assets/runtime-dom.esm-bundler-Q4NvWf_w.js">
      <link rel="modulepreload" crossorigin href="./assets/pinia-0wGps5Dj.js">
      <link rel="modulepreload" crossorigin href="./assets/preload-helper-Ck0A4US8.js">
      <link rel="modulepreload" crossorigin href="./assets/useLocale-BzWqCgAT.js">
      <link rel="modulepreload" crossorigin href="./assets/info-CjxRLk32.js">
      <link rel="stylesheet" crossorigin href="./assets/index-DeVYGgJZ.css">
    </head>

    <body>
        <!-- 首屏静态兜底内容（爬虫/无 JS/弱网可见；Vue 挂载时整体替换，正常用户几乎无感）。
             SEO 目的：SPA 空壳会让 Google 判「无内容」而长期不索引；
             此块提供可解析的标题与描述文本，作为被抓取与理解的最小静态内容。 -->
        <div id="app">
            <header>
                <h1>NEGIAO's WebGIS - 三维地理信息可视化平台</h1>
                <p>
                    这是一个基于 Vue 3 + OpenLayers + Cesium 构建的开源二维 / 三维一体化
                    WebGIS 平台，提供三维地球漫游、地形与影像底图、矢量与栅格数据导入
                    （SHP / KML / GeoJSON / GeoTIFF / GLTF / 3D Tiles）、建筑白模、
                    卷帘对比、空间分析与在线地图服务（WMS / WMTS / ArcGIS）聚合等能力。
                </p>
                <nav>
                    <ul>
                        <li><a href="/">首页 / 地图工作台</a></li>
                        <li><a href="/#/terms">服务条款</a></li>
                        <li><a href="/#/privacy">隐私政策</a></li>
                    </ul>
                </nav>
            </header>
        </div>
        <!-- 导入js文件 -->

        <script defer src="./min-enhanced.js"></script>
        <!--
        导入增强功能的js文件（51.la立即执行，其他延迟3秒 ）
        defer：不阻塞 HTML 解析，DOMContentLoaded 前按顺序执行
        该文件不在本仓库，位于个人主页index.html同级目录：negiao/negiao.github.io/WebGIS/min-enhanced.js
     -->
    </body>
</html>
