<!doctype html>
<html lang="zh-CN">
    <!--

    <head>
        <meta charset="UTF-8" />
        <!-- 隐藏 Referer 信息避免被跟踪 -->
        <!-- <meta name="referrer" content="no-referrer"> -->
        <link
            rel="icon"
            href="./images/icon.webp"
            type="image/x-icon"
        />
        <!-- 自定义网页的logo
             顶栏高清 logo 由 TopBar.vue 独立引用 images/icon.webp,互不影响 -->

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        />
        <!-- 多设备自适应 -->

        <!-- 🌟 改进 1：添加 meta description（解决【未说明用途】） -->
        <meta
            name="description"
            content="NEGIAO WebGIS is a web-based geographic information system designed for interactive spatial data visualization, cloud map layer management, and geospatial analytics."
        />

        <!-- Font Awesome (BootCDN 加速国内访问)
             media="print" + onload 交换:CSS 异步加载不阻塞首屏渲染(图标可能晚到约百毫秒);
             noscript 兜底保证无 JS 环境仍能加载图标样式 -->
        <link
            rel="stylesheet"
            href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            media="print"
            onload="this.media='all'; this.onload=null;"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            />
        </noscript>

        <!-- 关键资源预加载：减少首屏渲染等待 -->
        <link rel="preconnect" href="https://cdn.bootcdn.net" crossorigin />
        <!-- Cesium CDN 预连接（仅握手，不下载资源，不阻塞首屏） -->
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

        <!-- 🌟 保持不变：严格匹配 Google OAuth Console 中的应用名称 -->
        <title>NEGIAO WebGIS</title>

        <!-- Google Identity Services (One Tap / Sign In With Google) -->
        <script src="https://accounts.google.com/gsi/client" async defer></script>
      <script type="module" crossorigin src="./assets/index-CmmaSx0b.js"></script>
      <link rel="modulepreload" crossorigin href="./assets/vendor-vue-e5EuivCb.js">
      <link rel="modulepreload" crossorigin href="./assets/vendor-axios-BP3Np6Vt.js">
      <link rel="modulepreload" crossorigin href="./assets/vendor-runtime-Dp1pzeXC.js">
      <link rel="modulepreload" crossorigin href="./assets/vendor-lucide-Cj0-y9lj.js">
      <link rel="stylesheet" crossorigin href="./assets/index-CaxPIKUg.css">
    </head>

    <body>
        <div id="app">
            <!-- 🌟 改进 2：静态 HTML 兜底文本（解决无 JS 环境下的审核抓取）
                 当 Vue 脚本挂载成功后，这里的内容会被 Vue 组件自动擦除替换，完全不会影响正常用户体验；
                 但在爬虫直接获取服务端原文件时，能 100% 抓到名称与用途说明。 -->
            <div style="padding: 20px; font-family: system-ui, -apple-system, sans-serif;">
                <h1>NEGIAO WebGIS</h1>
                <p>
                    <strong>Application Purpose:</strong> 
                    NEGIAO WebGIS is a web-based geographic information system designed for interactive spatial data visualization, cloud map layer management, and geospatial analytics.
                </p>
            </div>
        </div>

        <!-- 导入js文件 -->

        <script defer src="./min-enhanced.js"></script>
        <!--
        导入增强功能的js文件（51.la立即执行，其他延迟3秒 ）
        defer：不阻塞 HTML 解析，DOMContentLoaded 前按顺序执行
        该文件不在本仓库，位于个人主页index.html同级目录：negiao/negiao.github.io/WebGIS/min-enhanced.js
     -->
    </body>
</html>
