# NEGIAO 个人主页 GitHub 边缘 API（Cloudflare Worker）
# 部署：本目录执行 npx wrangler login && npx wrangler deploy
# 首页引用：https://api.negiao.cn/api/snake|activity-graph.svg|stats|chart
name = "webgis-github-stats"
main = "src/index.js"
compatibility_date = "2025-08-01"

# 每 15 分钟暖一次 /api/stats 缓存（免费计划可用）
[triggers]
crons = ["*/15 * * * *"]

# 敏感配置不进 git：
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put STAR_HISTORY_SEALED_TOKEN

# 自定义域名：Cloudflare Dashboard → Workers → webgis-github-stats
# → Domains & Routes → api.negiao.cn
